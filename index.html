<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(ellipse at center,#f6f0e4 0%,#eee8dc 55%,#e2d8c6 100%);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  min-height:100dvh;padding:16px;font-family:Georgia,serif;overflow:hidden;
}
.card{
  --dur:2.2s;
  position:relative;
  width:min(100%,min(520px,calc((100dvh - 72px)*.75)));
  aspect-ratio:3/4;
  overflow:hidden;
  box-shadow:0 16px 48px #3b241b2e;
}

/* ---------- 1. Background layer (table/flowers/ribbon/envelope recess) ---------- */
#bg-layer{
  position:absolute;inset:0;
  background:url(background.jpg) center/100% 100% no-repeat;
  z-index:1;
}

/* ---------- 2. Invitation layer ----------
   Fitted by height inside envelope (top: 23.00%, bottom: 21.08% => height = 55.92%, width = 55.92%, left/right = 22.04%).
*/
#inside{
  position:absolute;
  top:23.00%;
  bottom:21.08%;
  left:22.04%;
  right:22.04%;
  overflow:hidden;
  background:#fffaf2;
  box-shadow:0 10px 28px #3b241b36;
  opacity:0;
  will-change:top,left,right,bottom,opacity;
  pointer-events:none;
  z-index:2;
  transition:
    opacity .45s ease .65s,
    top 1.55s cubic-bezier(.22,.82,.25,1) calc(var(--dur) * .4),
    left 1.55s cubic-bezier(.22,.82,.25,1) calc(var(--dur) * .4),
    right 1.55s cubic-bezier(.22,.82,.25,1) calc(var(--dur) * .4),
    bottom 1.55s cubic-bezier(.22,.82,.25,1) calc(var(--dur) * .4),
    z-index 0s linear calc(var(--dur) * .4 - .05s);
}
#inside img{width:100%;height:100%;object-fit:contain;display:block}

/* Expanded open state: rises above flaps and enlarges to full 3:4 card */
.card.open #inside{
  top:0;
  left:0;
  right:0;
  bottom:0;
  opacity:1;
  pointer-events:auto;
  z-index:5;
}

/* Closing: stays visible while shrinking back to envelope height (0s -> 1.15s), then drops below flaps as flaps close */
.card.closing #inside{
  top:23.00%;
  bottom:21.08%;
  left:22.04%;
  right:22.04%;
  opacity:1;
  pointer-events:none;
  z-index:2;
  transition:
    top 1.15s cubic-bezier(.4,0,.2,1) 0s,
    left 1.15s cubic-bezier(.4,0,.2,1) 0s,
    right 1.15s cubic-bezier(.4,0,.2,1) 0s,
    bottom 1.15s cubic-bezier(.4,0,.2,1) 0s,
    z-index 0s linear 1.15s;
}

/* ---------- 3. Envelope top & bottom flaps placed on top in closed position ---------- */
#cover{
  position:absolute;inset:0;border:0;padding:0;margin:0;
  background:transparent;
  cursor:pointer;
  z-index:3;
}
.card.open #cover{
  pointer-events:none;
}
#cover:focus-visible{outline:3px solid #8a4b12;outline-offset:4px}

.flap{
  position:absolute;
  left:10.3333%;
  width:79.3334%;
  transform-style:preserve-3d;
  will-change:transform;
  transition:transform var(--dur) cubic-bezier(.65,.05,.25,1);
}
.flap.top{
  top:23.00%;
  height:26.0833%;
  transform-origin:center top;
  transform:perspective(900px) rotateX(0deg);
  z-index:4;
}
.flap.bottom{
  top:49.0833%;
  height:29.8367%;
  transform-origin:center bottom;
  transform:perspective(900px) rotateX(0deg);
  z-index:3;
}

.face{
  position:absolute;inset:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}

.top .face.front{
  background:url(cover.jpg) 50% 31.116% / 126.0504% 383.387% no-repeat;
  box-shadow:0 -4px 20px #3b241b26;
}
.bottom .face.front{
  background:url(cover.jpg) 50% 70.011% / 126.0504% 335.158% no-repeat;
  box-shadow:0 8px 24px #3b241b26;
}

.bottom .face.front::before{
  content:"";
  position:absolute;
  left:31.5%;width:37%;top:-1px;height:38%;
  background:radial-gradient(ellipse 52% 96% at 50% 0%, #ebc094 68%, #ebc094dd 84%, transparent 100%);
  opacity:0;
  transition:opacity .35s ease;
  pointer-events:none;
}
.card.open .bottom .face.front::before{opacity:1}

.seal{
  position:absolute;
  left:31.7927%;width:35.8543%;
  top:99.5%;height:40.8946%;
  background:url(cover.jpg) 49.6894% 54.9440% / 351.5625% 937.5% no-repeat;
  clip-path:ellipse(50% 100% at 50% 0);
  z-index:2;
}

.face.front::after{
  content:"";position:absolute;inset:0;opacity:0;
  transition:opacity var(--dur) ease;
}
.top .face.front::after{background:linear-gradient(180deg,transparent 30%,#3b241b55)}
.bottom .face.front::after{background:linear-gradient(0deg,transparent 30%,#3b241b55)}

/* Back of flaps matched directly to background envelope's exact warm champagne/peach-tan paper tones */
.face.back{
  transform:rotateX(180deg);
  background:
    repeating-linear-gradient(90deg,rgba(168,124,78,.03) 0 1px,transparent 1px 6px),
    repeating-linear-gradient(0deg,rgba(130,90,48,.022) 0 1px,transparent 1px 5px),
    linear-gradient(180deg,#f0c79c 0%,#ebc094 55%,#e4b588 100%);
}
.top .face.back{
  background:
    repeating-linear-gradient(90deg,rgba(168,124,78,.03) 0 1px,transparent 1px 6px),
    repeating-linear-gradient(0deg,rgba(130,90,48,.022) 0 1px,transparent 1px 5px),
    linear-gradient(180deg,#f2c99e 0%,#edc295 55%,#ebc094 100%);
  box-shadow:inset 0 14px 24px #7c4f2424;
}
.bottom .face.back{
  background:
    repeating-linear-gradient(90deg,rgba(168,124,78,.03) 0 1px,transparent 1px 6px),
    repeating-linear-gradient(0deg,rgba(130,90,48,.022) 0 1px,transparent 1px 5px),
    linear-gradient(180deg,#ebc094 0%,#e6b78a 58%,#e2b386 100%);
  box-shadow:inset 0 -14px 24px #7c4f2424;
}
.face.back::before{
  content:"";position:absolute;inset:10px;border:1px solid #b5895578;border-radius:2px;
}
.seal-back{
  position:absolute;
  left:31.7927%;width:35.8543%;
  bottom:99.5%;height:40.8946%;
  background:radial-gradient(circle at 50% 100%,#cfa052 0 62%,#b9883d 63% 100%);
  clip-path:ellipse(50% 100% at 50% 100%);
}

/* Open state: flaps swing open */
.card.open .flap.top{transform:perspective(900px) rotateX(165deg)}
.card.open .flap.bottom{transform:perspective(900px) rotateX(-165deg)}
.card.open .face.front::after{opacity:1}

/* Closing state: wait 1.15s until invitation shrinks back to envelope height before folding flaps shut */
.card.closing .flap.top{
  transform:perspective(900px) rotateX(0deg);
  transition:transform 1.5s cubic-bezier(.65,.05,.25,1) 1.15s;
}
.card.closing .flap.bottom{
  transform:perspective(900px) rotateX(0deg);
  transition:transform 1.5s cubic-bezier(.65,.05,.25,1) 1.15s;
}
.card.closing .face.front::after{
  opacity:0;
  transition:opacity 1.1s ease 1.15s;
}
.card.closing .bottom .face.front::before{
  opacity:0;
  transition:opacity .3s ease 1.4s;
}

/* Gentle idle nudge */
.card:not(.open):not(.used) .flap.top{animation:nudgeT 3.2s ease-in-out 1.2s infinite}
.card:not(.open):not(.used) .flap.bottom{animation:nudgeB 3.2s ease-in-out 1.2s infinite}
@keyframes nudgeT{
  0%,70%,100%{transform:perspective(900px) rotateX(0deg)}
  80%{transform:perspective(900px) rotateX(10deg)}
  90%{transform:perspective(900px) rotateX(0deg)}
}
@keyframes nudgeB{
  0%,70%,100%{transform:perspective(900px) rotateX(0deg)}
  80%{transform:perspective(900px) rotateX(-7deg)}
  90%{transform:perspective(900px) rotateX(0deg)}
}
.card.used .flap{animation:none!important}

/* Flap-sourced dot craters */
.dot-crater{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  z-index:6;
  background:var(--dot-bg,radial-gradient(circle,#fff6d6 0%,#e6b85c 50%,transparent 75%));
  box-shadow:0 0 10px rgba(230,184,92,.45);
  animation:dotCrater 1.75s cubic-bezier(.16,.84,.3,1) forwards;
}
@keyframes dotCrater{
  0%{transform:translate(0,0) scale(.35);opacity:0}
  18%{opacity:1}
  100%{transform:translate(var(--x),var(--y)) scale(1.65);opacity:0}
}

.hint{
  margin-top:14px;color:#7a5532;font-size:14px;letter-spacing:.12em;text-transform:uppercase;
  transition:opacity .5s ease;animation:pulse 2.4s ease-in-out infinite;
}
.card.open + .hint{opacity:0;animation:none}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

/* ---------- Map links & back button ---------- */
.map-link{position:absolute;display:block;cursor:pointer;border-radius:999px}
.map-link:focus-visible{outline:3px solid #8a4b12;outline-offset:2px}
#back{
  position:absolute;top:8px;left:8px;border:1px solid #ad8954;border-radius:20px;
  background:#fff9edec;color:#57351e;padding:6px 12px;cursor:pointer;font-size:12px;opacity:.86;
}
#back:focus-visible{outline:3px solid #8a4b12}
@media (hover:hover){#back{opacity:0;transition:opacity .15s}#inside:hover #back,#back:focus-visible{opacity:1}}

@media (prefers-reduced-motion:reduce){
  .card{--dur:.01s}
  .flap{animation:none!important}
  #inside{transition:opacity .4s ease}
  .hint{animation:none}
}
@media print{
  body{padding:0;background:white}.card{width:100%}
  #cover,.hint,#back{display:none}
  #inside{top:0;left:0;right:0;bottom:0;opacity:1;box-shadow:none}
}
</style>
</head>
<body>
<main class="card" id="card" aria-label="Abhil and Nima wedding reception invitation">
  <div id="bg-layer" aria-hidden="true"></div>
  <section id="inside" aria-label="Wedding reception invitation details" aria-hidden="true">
    <img src="invitation.png" alt="Wedding reception invitation for Abhil with Nima on Saturday, 12 December 2026 from 5:00 PM to 9:00 PM at Mechery’s Auditorium, Pound Jn., Varandarappilly">
    <a class="map-link" href="https://maps.app.goo.gl/5WyQAqp9WyLKatZp6" target="_blank" rel="noopener noreferrer" aria-label="Open Mechery’s Auditorium in Google Maps" tabindex="-1" style="left:33.5%;top:79.4%;width:33.0%;height:4.2%"></a>
    <button id="back" type="button" aria-label="Return to cover" tabindex="-1">← Cover</button>
  </section>
  <button id="cover" type="button" aria-label="Open wedding reception invitation — Abhil with Nima, 12 December 2026" aria-hidden="false" tabindex="0">
    <span class="flap bottom"><span class="face front"></span><span class="face back"></span></span>
    <span class="flap top"><span class="face front"><span class="seal"></span></span><span class="face back"><span class="seal-back"></span></span></span>
  </button>
</main>
<p class="hint" aria-hidden="true">Tap to open</p>

<script>
(function(){
  var card=document.getElementById('card');
  var cover=document.getElementById('cover');
  var inside=document.getElementById('inside');
  var focusables=inside.querySelectorAll('a,button');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var animating=false;
  var animTimer=null;

  window.addEventListener('load',function(){
    ['background.jpg','cover.jpg','invitation.png'].forEach(function(src){
      var img=new Image();
      img.src=src;
      if(img.decode)img.decode().catch(function(){});
    });
  });

  function setInsideFocusable(on){
    inside.setAttribute('aria-hidden',on?'false':'true');
    cover.setAttribute('aria-hidden',on?'true':'false');
    cover.tabIndex=on?-1:0;
    focusables.forEach(function(el){el.tabIndex=on?0:-1});
  }

  function dotCratersOnGo(){
    if(reduce)return;
    var r=card.getBoundingClientRect();
    var seamY=r.height*0.490833;
    var topFlapRect={
      left:r.width*0.103333,
      width:r.width*0.793334,
      top:r.height*0.2300,
      height:r.height*0.260833
    };
    var botFlapRect={
      left:r.width*0.103333,
      width:r.width*0.793334,
      top:r.height*0.490833,
      height:r.height*0.298367
    };

    for(var i=0;i<72;i++){
      var fromTop=i%2===0;
      var box=fromTop?topFlapRect:botFlapRect;
      var dot=document.createElement('span');
      dot.className='dot-crater';

      var size=5+Math.random()*6;
      var startX=box.left+Math.random()*box.width;
      var startY=box.top+Math.random()*box.height;

      dot.style.width=size+'px';
      dot.style.height=size+'px';
      dot.style.left=(startX-size/2)+'px';
      dot.style.top=(startY-size/2)+'px';

      dot.style.setProperty(
        '--dot-bg',
        fromTop
          ? 'radial-gradient(circle,#fff7dc 0%,#f2c99e 48%,#cfa052 76%,transparent 100%)'
          : 'radial-gradient(circle,#fff3d1 0%,#e6b78a 48%,#b9883d 76%,transparent 100%)'
      );

      var angle=fromTop
        ? (-Math.PI*0.85 + Math.random()*Math.PI*0.7)
        : (Math.PI*0.15 + Math.random()*Math.PI*0.7);
      var dist=24+Math.random()*(r.width*0.34);
      var dx=Math.cos(angle)*dist;
      var dy=Math.sin(angle)*dist + (fromTop ? (seamY-startY)*0.25 : (seamY-startY)*0.15);

      dot.style.setProperty('--x',dx+'px');
      dot.style.setProperty('--y',dy+'px');
      dot.style.animationDelay=(Math.random()*.45)+'s';
      card.appendChild(dot);
      setTimeout(function(el){el.remove()},2300,dot);
    }
  }

  function openCard(){
    if(animating||card.classList.contains('open'))return;
    animating=true;
    clearTimeout(animTimer);
    card.classList.add('used');
    card.classList.remove('closing');
    void card.offsetWidth;
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        card.classList.add('open');
        setInsideFocusable(true);
        dotCratersOnGo();
        animTimer=setTimeout(function(){animating=false;},3200);
      });
    });
  }

  function closeCard(){
    if(animating||!card.classList.contains('open'))return;
    animating=true;
    clearTimeout(animTimer);
    setInsideFocusable(false);
    card.classList.remove('open');
    card.classList.add('closing');
    void card.offsetWidth;
    cover.focus({preventScroll:true});
    animTimer=setTimeout(function(){
      card.classList.remove('closing');
      animating=false;
    },2700);
  }

  cover.addEventListener('click',openCard);
  document.getElementById('back').addEventListener('click',function(e){e.stopPropagation();closeCard()});
  inside.addEventListener('click',function(e){if(e.target.closest('a,button'))return;closeCard()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeCard()});
})();
</script>
</body>
</html>
